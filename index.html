<html lang="lv">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>dūmu aparāti — Store</title>
<style>
:root{color-scheme:dark;--bg:#0c0d0e;--panel:#151719;--panel2:#1b1e20;--line:#292e31;--text:#f2f3f3;--muted:#92999d;--accent:#d9e2dc;--green:#9ad4ad;--red:#ff8989;--amber:#e8c27d;--radius:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;min-height:100vh;padding:26px 24px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.brand{font-size:20px;font-weight:750;letter-spacing:-.7px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-top:3px}.top-actions{display:flex;gap:9px}.nav{display:flex;gap:7px;overflow:auto;padding:5px;background:#111314;border:1px solid var(--line);border-radius:14px;margin-bottom:25px}.nav button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:10px}.nav button.active{background:#292e30;color:white}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 20px}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.8px}.pagehead h1{font-size:28px;letter-spacing:-1px;margin:4px 0 0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px}.btn.primary{background:#e2e8e3;color:#101312;border-color:#e2e8e3;font-weight:700}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:27px;font-weight:720;letter-spacing:-1px;margin-top:9px}.stat .sub{font-size:11px;color:var(--muted);margin-top:4px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.panel h2{font-size:15px;margin:0 0 14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel-head h2{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.productline{display:flex;align-items:center;gap:11px;min-width:0}.thumb{width:43px;height:48px;border-radius:9px;background:#24292b;object-fit:cover;flex:none}.thumb.placeholder{display:grid;place-items:center;color:#70797c;font-size:18px}.pname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:12px;color:var(--muted)}.pill{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:3px 8px;color:var(--muted);font-size:11px}.pill.low{color:var(--amber);border-color:#6d5835}.pill.good{color:var(--green);border-color:#365b43}.pill.bad{color:var(--red);border-color:#633939}.toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;flex:1;min-width:0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#101213;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#75827a}input[type=file]{padding:8px}textarea{min-height:75px;resize:vertical}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:570px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600;padding:11px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}.table tr:last-child td{border-bottom:0}.right{text-align:right}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#171a1c;border:1px solid var(--line);border-radius:18px;width:min(590px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 25px 90px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{margin:0;font-size:19px}.formrow{display:flex;gap:10px}.variantbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.varianttop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.photo-preview{width:70px;height:78px;object-fit:cover;border-radius:10px;background:#252a2c}.barlist{display:grid;gap:12px}.baritem{display:grid;grid-template-columns:100px 1fr 65px;gap:9px;align-items:center;font-size:12px}.bartrack{height:8px;background:#292e30;border-radius:20px;overflow:hidden}.barfill{height:100%;background:#a8b8ad;border-radius:20px}.footnote{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5}.mobileadd{display:none}
@media(max-width:760px){.shell{padding:18px 14px 100px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:14px}.stat .value{font-size:22px}.two{grid-template-columns:1fr}.pagehead h1{font-size:24px}.nav{margin:0 -2px 20px}.top{margin-bottom:20px}.top-actions .btn{padding:8px 10px}.mobileadd{display:inline-flex}.desktopadd{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">dūmu aparāti<small>STORE MANAGEMENT</small></div>
    <div class="top-actions"><button class="btn small" id="backupBtn">Backup</button><button class="btn small" id="settingsBtn">Settings</button></div>
  </header>
  <nav class="nav" id="nav">
    <button data-page="overview" class="active">Overview</button><button data-page="inventory">Inventory</button><button data-page="sales">Sales</button><button data-page="expenses">Expenses</button><button data-page="analytics">Analytics</button>
  </nav>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>
<input id="importFile" type="file" accept="application/json" class="hidden">
<script>
const DB_NAME='dumu-aparati-db', DB_VERSION=1, EUR=new Intl.NumberFormat('lv-LV',{style:'currency',currency:'EUR'});
let db, page='overview', products=[], sales=[], expenses=[], settings={lowStock:2};
const money=n=>EUR.format(Number(n)||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;['products','sales','expenses','settings'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function del(store,id){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function refresh(){[products,sales,expenses]=await Promise.all([all('products'),all('sales'),all('expenses')]);render()}
function variants(p){return p.variants||[]}
function stock(p){return variants(p).reduce((a,v)=>a+(+v.qty||0),0)}
function costOfSale(s){const unitCost=s.costAtSale??(()=>{const p=products.find(p=>p.id===s.productId),v=p&&variants(p).find(v=>v.id===s.variantId);return v?+v.cost:0})();return unitCost*(+s.qty||0)}
function totalRevenue(){return sales.reduce((a,s)=>a+(+s.total||0),0)}
function totalCOGS(){return sales.reduce((a,s)=>a+costOfSale(s),0)}
function totalExpenses(){return expenses.reduce((a,e)=>a+(+e.amount||0),0)}
function profit(){return totalRevenue()-totalCOGS()-totalExpenses()}
function dateLabel(x){return new Date(x).toLocaleDateString('lv-LV',{day:'2-digit',month:'short',year:'numeric'})}
function productName(id){return products.find(p=>p.id===id)?.name||'Deleted product'}
function variantName(p,id){const v=variants(p).find(v=>v.id===id);return v?[v.size,v.color].filter(Boolean).join(' / '):'—'}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function img(p){return ''}
function empty(title,desc){return `<div class="empty"><strong>${title}</strong>${desc}</div>`}
function render(){
 const app=document.getElementById('app');
 if(page==='overview')app.innerHTML=overview();
 if(page==='inventory')app.innerHTML=inventory();
 if(page==='sales')app.innerHTML=salesPage();
 if(page==='expenses')app.innerHTML=expensesPage();
 if(page==='analytics')app.innerHTML=analytics();
}
function overview(){
 const low=products.filter(p=>stock(p)<=settings.lowStock);
 const recent=[...sales].sort((a,b)=>b.date-a.date).slice(0,5);
 return `<div class="pagehead"><div><div class="eyebrow">YOUR STORE / TODAY</div><h1>Overview</h1></div><button class="btn primary desktopadd" onclick="openSale()">＋ New sale</button></div>
 <section class="grid">${stat('Revenue',money(totalRevenue()),'All recorded sales')}${stat('Gross profit',money(totalRevenue()-totalCOGS()),'Before store expenses')}${stat('Net profit',money(profit()),'After recorded expenses')}${stat('Products',products.length,`${products.reduce((n,p)=>n+stock(p),0)} items in stock`)}</section>
 <div class="two"><section class="panel"><div class="panel-head"><h2>Recent sales</h2><button class="btn small" onclick="setPage('sales')">View all</button></div>${recent.length?recent.map(s=>`<div class="row"><div><div class="pname">${esc(productName(s.productId))}</div><div class="tiny">${dateLabel(s.date)} · ${s.qty} item(s)</div></div><strong>${money(s.total)}</strong></div>`).join(''):empty('No sales yet','Your recorded sales will appear here.')}</section>
 <section class="panel"><div class="panel-head"><h2>Stock to check</h2><span class="pill low">${low.length} low</span></div>${low.length?low.slice(0,6).map(p=>`<div class="row"><div class="productline">${img(p)}<div><div class="pname">${esc(p.name)}</div><div class="tiny">${esc(p.category||'Uncategorised')}</div></div></div><span class="pill low">${stock(p)} left</span></div>`).join(''):empty('Stock looks good','No products at or below your low-stock threshold.')}</section></div>
 <div class="footnote">Numbers are calculated from the sales, product costs and expenses you enter. This is a private local prototype; keep regular backups.</div>`;
}
function inventory(){
 return `<div class="pagehead"><div><div class="eyebrow">CATALOGUE</div><h1>Inventory</h1></div><button class="btn primary" onclick="openProduct()">＋ Add product</button></div>
 <div class="toolbar"><input id="searchProducts" style="max-width:280px" oninput="filterProducts()"><select id="categoryFilter" style="max-width:190px" onchange="filterProducts()"><option value="">All models</option>${[...new Set(products.map(p=>p.category).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
 <section class="panel"><div id="productRows">${productRows(products)}</div></section>`;
}
function productRows(list){if(!list.length)return empty('No products yet','Add your first item to start building your inventory.');return `<div class="tablewrap"><table class="table"><thead><tr><th>Flavour</th><th>Model</th><th>Quantity</th><th class="right">Sale price</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="pname">${esc(p.name)}</div></td><td>${esc(p.category||'—')}</td><td><span class="pill ${stock(p)<=settings.lowStock?'low':'good'}">${stock(p)}</span></td><td class="right">${money(variants(p).length?variants(p)[0].price:0)}</td><td class="right"><button class="btn small" onclick="openProduct('${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function filterProducts(){const q=document.getElementById('searchProducts').value.toLowerCase(),c=document.getElementById('categoryFilter').value;document.getElementById('productRows').innerHTML=productRows(products.filter(p=>(p.name+' '+(p.category||'')).toLowerCase().includes(q)&&(!c||p.category===c)))}
function salesPage(){return `<div class="pagehead"><div><div class="eyebrow">TRANSACTIONS</div><h1>Sales</h1></div><button class="btn primary" onclick="openSale()">＋ New sale</button></div><div class="grid" style="margin-bottom:14px">${stat('Total sales',sales.length,'Transactions')}${stat('Revenue',money(totalRevenue()),'Recorded sales')}${stat('Cost of goods',money(totalCOGS()),'Cost captured when each sale was recorded')}${stat('Gross profit',money(totalRevenue()-totalCOGS()),'Revenue minus product cost')}</div><section class="panel">${sales.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Flavour</th><th>Model</th><th>Qty</th><th>Sale total</th><th></th></tr></thead><tbody>${[...sales].sort((a,b)=>b.date-a.date).map(s=>{const p=products.find(p=>p.id===s.productId);return `<tr><td>${dateLabel(s.date)}</td><td>${esc(productName(s.productId))}</td><td>${esc(p?.category||'—')}</td><td>${s.qty}</td><td>${money(s.total)}</td><td class="right"><button class="btn small danger" onclick="deleteSale('${s.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:empty('No sales recorded','Use “New sale” when an item is sold in your store.')}</section>`}
function expensesPage(){return `<div class="pagehead"><div><div class="eyebrow">STORE COSTS</div><h1>Expenses</h1></div><button class="btn primary" onclick="openExpense()">＋ Add expense</button></div><div class="grid" style="margin-bottom:14px">${stat('Total expenses',money(totalExpenses()),'All recorded costs')}${stat('Expense entries',expenses.length,'Transactions')}${stat('Net profit',money(profit()),'After expenses')}${stat('Average expense',money(expenses.length?totalExpenses()/expenses.length:0),'Per entry')}</div><section class="panel">${expenses.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead><tbody>${[...expenses].sort((a,b)=>b.date-a.date).map(e=>`<tr><td>${dateLabel(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.category||'Other')}</td><td class="right">${money(e.amount)}</td><td class="right"><button class="btn small danger" onclick="deleteExpense('${e.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:empty('No expenses yet','Track rent, utilities, packaging and other store costs here.')}</section>`}
function analytics(){
 const month=new Date();const monthSales=sales.filter(s=>{const d=new Date(s.date);return d.getMonth()===month.getMonth()&&d.getFullYear()===month.getFullYear()});
 const byProduct={};sales.forEach(s=>byProduct[s.productId]=(byProduct[s.productId]||0)+s.qty);
 const best=Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,5),max=Math.max(1,...best.map(x=>x[1]));
 const cats={};products.forEach(p=>cats[p.category||'Other']=(cats[p.category||'Other']||0)+stock(p));
 return `<div class="pagehead"><div><div class="eyebrow">PERFORMANCE</div><h1>Analytics</h1></div></div><div class="grid">${stat('This month',money(monthSales.reduce((a,s)=>a+s.total,0)),`${monthSales.length} sales`)}${stat('Net profit',money(profit()),'All time')}${stat('Units sold',sales.reduce((a,s)=>a+(+s.qty||0),0),'All time')}${stat('Stock value',money(products.reduce((a,p)=>a+variants(p).reduce((b,v)=>b+(+v.qty||0)*(+v.cost||0),0),0)),'At purchase cost')}</div><div class="two"><section class="panel"><h2>Best sellers · units sold</h2>${best.length?`<div class="barlist">${best.map(([id,n])=>`<div class="baritem"><span>${esc(productName(id))}</span><div class="bartrack"><div class="barfill" style="width:${n/max*100}%"></div></div><strong class="right">${n}</strong></div>`).join('')}</div>`:empty('No sales data','Best sellers appear after you record sales.')}</section><section class="panel"><h2>Stock by model</h2>${Object.keys(cats).length?Object.entries(cats).map(([c,n])=>`<div class="row"><span>${esc(c)}</span><strong>${n} units</strong></div>`).join(''):empty('No inventory','Add products and categories to see stock breakdown.')}</section></div><div class="footnote">Analytics are based on records stored in this browser. Deleting a product does not delete its past sales; however, cost-of-goods calculations for deleted products may no longer be available.</div>`;
}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn small" onclick="closeModal()">✕</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openProduct(id){const p=products.find(p=>p.id===id)||{name:'',category:'',variants:[{id:uid(),size:'',color:'',qty:0,cost:0,price:0}]};const oldVariants=variants(p);const quantity=oldVariants.reduce((n,v)=>n+(Number(v.qty)||0),0);const first=oldVariants[0]||{id:uid(),qty:0,cost:0,price:0};const weightedCost=quantity?oldVariants.reduce((n,v)=>n+(Number(v.qty)||0)*(Number(v.cost)||0),0)/quantity:(Number(first.cost)||0);modal(id?'Edit product':'Add product',`<form id="productForm"><div class="formrow"><div class="field"><label>Flavour *</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Model</label><input name="category" value="${esc(p.category)}"></div></div><div class="formrow"><div class="field"><label>Quantity</label><input name="quantity" type="number" min="0" step="1" value="${quantity}" required></div><div class="field"><label>Sale price (€)</label><input name="price" type="number" min="0" step=".01" value="${Number(first.price)||0}" required></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>`);
 document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();const f=e.target,old=products.find(x=>x.id===id);await put('products',{id:id||uid(),name:f.name.value.trim(),category:f.category.value.trim(),variants:[{id:first.id||uid(),size:'',color:'',qty:Math.max(0,Number(f.quantity.value)||0),cost:weightedCost,price:Math.max(0,Number(f.price.value)||0)}],createdAt:old?.createdAt||Date.now()});closeModal();await refresh()};
}
function resizeImage(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}
function openSale(){if(!products.length){alert('Add a product before recording a sale.');return}modal('Record a sale',`<form id="saleForm"><div class="field"><label>Product</label><select id="saleProduct" required>${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><select id="saleVariant" required class="hidden"></select><div class="formrow"><div class="field"><label>Quantity sold</label><input id="saleQty" type="number" min="1" step="1" value="1" required></div><div class="field"><label>Sale price per item (€)</label><input id="salePrice" type="number" min="0" step=".01" required></div></div><div class="tiny" id="stockHint"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save sale & reduce stock</button></div></form>`);
 const prod=document.getElementById('saleProduct'),variant=document.getElementById('saleVariant'),price=document.getElementById('salePrice'),qty=document.getElementById('saleQty'),hint=document.getElementById('stockHint');
 function update(){const p=products.find(x=>x.id===prod.value);variant.innerHTML=variants(p).map(v=>`<option value="${v.id}">${esc([v.size,v.color].filter(Boolean).join(' / ')||'Default')} · ${v.qty} in stock</option>`).join('');setPrice()}
 function setPrice(){const p=products.find(x=>x.id===prod.value),v=variants(p).find(x=>x.id===variant.value);price.value=v?.price??0;hint.textContent=v?`Available: ${v.qty} · Purchase cost: ${money(v.cost)}`:''}
 prod.onchange=update;variant.onchange=setPrice;update();
 document.getElementById('saleForm').onsubmit=async e=>{e.preventDefault();const p=products.find(x=>x.id===prod.value),v=variants(p).find(x=>x.id===variant.value),n=Number(qty.value),pr=Number(price.value);if(!v||n<1||n>v.qty){alert('Not enough stock for this sale.');return}v.qty-=n;await put('products',p);await put('sales',{id:uid(),productId:p.id,variantId:v.id,qty:n,unitPrice:pr,total:n*pr,date:Date.now(),costAtSale:v.cost});closeModal();await refresh()};
}
async function deleteSale(id){if(!confirm('Delete this sale and return its items to stock?'))return;const s=sales.find(x=>x.id===id),p=products.find(x=>x.id===s.productId),v=p&&variants(p).find(x=>x.id===s.variantId);if(v){v.qty+=s.qty;await put('products',p)}await del('sales',id);await refresh()}
function openExpense(){modal('Add expense',`<form id="expenseForm"><div class="field"><label>Description *</label><input name="description" required></div><div class="formrow"><div class="field"><label>Amount (€) *</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Category</label><select name="category"><option>Rent</option><option>Utilities</option><option>Packaging</option><option>Transport</option><option>Marketing</option><option>Other</option></select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form>`);document.getElementById('expenseForm').onsubmit=async e=>{e.preventDefault();const f=e.target;await put('expenses',{id:uid(),description:f.description.value.trim(),amount:Number(f.amount.value),category:f.category.value,date:Date.now()});closeModal();await refresh()}}
async function deleteExpense(id){if(confirm('Delete this expense?')){await del('expenses',id);await refresh()}}
function backup(){const data={app:'dumu-aparati',version:1,exportedAt:new Date().toISOString(),products,sales,expenses,settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dumu-aparati-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('backupBtn').onclick=backup;
document.getElementById('settingsBtn').onclick=()=>{modal('Settings & data',`<div class="field"><label>Low-stock warning threshold (units)</label><input id="lowStockInput" type="number" min="0" value="${settings.lowStock}"></div><p class="tiny">Your information is saved in this browser on this device. Export backups regularly. Importing a backup replaces the current store data.</p><div class="actions"><button class="btn" onclick="document.getElementById('importFile').click();closeModal()">Import backup</button><button class="btn primary" onclick="saveSettings()">Save settings</button></div>`)}
async function saveSettings(){settings.lowStock=Math.max(0,Number(document.getElementById('lowStockInput').value)||0);await put('settings',{id:'main',...settings});closeModal();render()}
document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='dumu-aparati'||!Array.isArray(d.products)||!Array.isArray(d.sales)||!Array.isArray(d.expenses))throw Error('Invalid backup');if(!confirm('Importing will replace the current products, sales and expenses. Continue?'))return;for(const s of ['products','sales','expenses']){const t=db.transaction(s,'readwrite'),store=t.objectStore(s);store.clear();d[s].forEach(x=>store.put(x));await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)})}settings=d.settings||settings;await put('settings',{id:'main',...settings});await refresh();alert('Backup imported.')}catch(err){alert('Could not import this backup file.')}e.target.value=''};
(async()=>{try{db=await openDB();const st=await all('settings');if(st[0])settings={lowStock:st[0].lowStock??2};await refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){document.getElementById('app').innerHTML=empty('Could not start the app','Please open this app in a modern browser with storage enabled.')}})();
