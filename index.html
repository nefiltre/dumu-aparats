<style>
:root{color-scheme:dark;--bg:#0c0d0e;--panel:#151719;--panel2:#1b1e20;--line:#292e31;--text:#f2f3f3;--muted:#92999d;--accent:#d9e2dc;--green:#9ad4ad;--red:#ff8989;--amber:#e8c27d;--radius:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;min-height:100vh;padding:26px 24px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.brand{font-size:31px;font-weight:750;letter-spacing:-.7px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-top:3px}.top-actions{display:flex;gap:9px}.nav{display:flex;gap:7px;overflow:auto;padding:5px;background:#111314;border:1px solid var(--line);border-radius:14px;margin-bottom:25px}.nav button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 15px;border-radius:10px}.nav button.active{background:#292e30;color:white}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 20px}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.8px}.pagehead h1{font-size:28px;letter-spacing:-1px;margin:4px 0 0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px}.btn.primary{background:#e2e8e3;color:#101312;border-color:#e2e8e3;font-weight:700}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:27px;font-weight:720;letter-spacing:-1px;margin-top:9px}.stat .sub{font-size:11px;color:var(--muted);margin-top:4px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}.panel h2{font-size:15px;margin:0 0 14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel-head h2{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.productline{display:flex;align-items:center;gap:11px;min-width:0}.thumb{width:43px;height:48px;border-radius:9px;background:#24292b;object-fit:cover;flex:none}.thumb.placeholder{display:grid;place-items:center;color:#70797c;font-size:18px}.pname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:12px;color:var(--muted)}.pill{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:3px 8px;color:var(--muted);font-size:11px}.pill.low{color:var(--amber);border-color:#6d5835}.pill.good{color:var(--green);border-color:#365b43}.pill.bad{color:var(--red);border-color:#633939}.toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;flex:1;min-width:0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#101213;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#75827a}input[type=file]{padding:8px}textarea{min-height:75px;resize:vertical}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:570px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600;padding:11px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid var(--line);font-size:13px}.table tr:last-child td{border-bottom:0}.right{text-align:right}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:5px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#171a1c;border:1px solid var(--line);border-radius:18px;width:min(590px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 25px 90px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{margin:0;font-size:19px}.formrow{display:flex;gap:10px}.variantbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.varianttop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.photo-preview{width:70px;height:78px;object-fit:cover;border-radius:10px;background:#252a2c}.barlist{display:grid;gap:12px}.baritem{display:grid;grid-template-columns:100px 1fr 65px;gap:9px;align-items:center;font-size:12px}.bartrack{height:8px;background:#292e30;border-radius:20px;overflow:hidden}.barfill{height:100%;background:#a8b8ad;border-radius:20px}.footnote{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5}.mobileadd{display:none}
@media(max-width:760px){.shell{padding:18px 14px 100px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:14px}.stat .value{font-size:22px}.two{grid-template-columns:1fr}.pagehead h1{font-size:24px}.nav{margin:0 -2px 20px}.top{margin-bottom:20px}.top-actions .btn{padding:8px 10px}.mobileadd{display:inline-flex}.desktopadd{display:none}}
.smokebg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.42}.shell{position:relative;z-index:1}@media(max-width:760px){.shell{padding-top:calc(18px + env(safe-area-inset-top,0px))}}.stat,.panel{background:rgba(21,23,25,.62);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}.nav{background:rgba(17,19,20,.8);scrollbar-width:none;-ms-overflow-style:none}.nav::-webkit-scrollbar{display:none}

<div class="shell">
  <header class="top">
    <div class="brand">dūmu aparāti</div>
    <div class="top-actions"><button class="btn" id="settingsBtn" aria-label="Settings" style="padding:9px 10px;line-height:0"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
  </header>
  <nav class="nav" id="nav">
    <button data-page="overview" class="active">Overview</button><button data-page="inventory">Inventory</button><button data-page="sales">Sales</button><button data-page="analytics">Analytics</button>
  </nav>
  <main id="app"></main>

<script>
const DB_NAME='dumu-aparati-db', DB_VERSION=1, EUR=new Intl.NumberFormat('lv-LV',{style:'currency',currency:'EUR'});
let db, page='overview', products=[], sales=[], expenses=[], settings={lowStock:2,unitCost:0};
const money=n=>EUR.format(Number(n)||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;['products','sales','expenses','settings'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function del(store,id){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function refresh(){[products,sales,expenses]=await Promise.all([all('products'),all('sales'),all('expenses')]);render()}
function variants(p){return p.variants||[]}
function stock(p){return variants(p).reduce((a,v)=>a+(+v.qty||0),0)}
function costOfSale(s){const unitCost=s.costAtSale??(()=>{const p=products.find(p=>p.id===s.productId),v=p&&variants(p).find(v=>v.id===s.variantId);return v?+v.cost:0})();return unitCost*(+s.qty||0)}
function totalRevenue(){return sales.reduce((a,s)=>a+(+s.total||0),0)}
function totalCOGS(){return sales.reduce((a,s)=>a+costOfSale(s),0)}
function unitsSold(){return sales.reduce((n,s)=>n+(Number(s.qty)||0),0)}
function saleCost(s){return ((+s.costAtSale>0?+s.costAtSale:+settings.unitCost)||0)*(+s.qty||0)}
function overviewCost(){return sales.reduce((a,s)=>a+saleCost(s),0)}
function dateLabel(x){return new Date(x).toLocaleDateString('lv-LV',{day:'2-digit',month:'short',year:'numeric'})}
function productName(id){return products.find(p=>p.id===id)?.name||'Deleted product'}
function variantName(p,id){const v=variants(p).find(v=>v.id===id);return v?[v.size,v.color].filter(Boolean).join(' / '):'—'}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function img(p){return ''}
function empty(title,desc=''){return `<div class="empty"><strong>${title}</strong>${desc}</div>`}
function render(){
 const app=document.getElementById('app');
 if(page==='overview')app.innerHTML=overview();
 if(page==='inventory')app.innerHTML=inventory();
 if(page==='sales')app.innerHTML=salesPage();
  if(page==='analytics')app.innerHTML=analytics();
}
function overview(){
 const recent=[...sales].sort((a,b)=>b.date-a.date).slice(0,5),total=products.reduce((n,p)=>n+stock(p),0),order=['RAVE 40K','STAR 40K','VISTA 40K'],by={};
 products.forEach(p=>{const c=p.category||'Other';by[c]=(by[c]||0)+stock(p)});
 const models=Object.keys(by).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)}),mx=Math.max(1,...Object.values(by));
 return `<div class="pagehead"><div><h1>Overview</h1></div><button class="btn primary desktopadd" onclick="openSale()">＋ New sale</button></div>
 <section class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${stat('Revenue',money(totalRevenue()))}${stat('Profit',money(totalRevenue()-overviewCost()))}</section>
 <section class="panel" style="margin-top:13px"><div class="panel-head"><h2>In stock</h2><span style="font-size:27px;font-weight:720;letter-spacing:-1px">${total}</span></div>${models.length?`<div class="barlist">${models.map(m=>`<div class="baritem"><span>${esc(m)}</span><div class="bartrack"><div class="barfill" style="width:${by[m]/mx*100}%"></div></div><strong class="right">${by[m]}</strong></div>`).join('')}</div>`:''}</section>
 <section class="panel" style="margin-top:13px"><div class="panel-head"><h2>Recent sales</h2><button class="btn small" onclick="setPage('sales')">View all</button></div>${recent.length?recent.map(s=>`<div class="row"><div><div class="pname">${esc(productName(s.productId))}</div><div class="tiny">${dateLabel(s.date)} · ${s.qty} item(s)</div></div><strong>${money(s.total)}</strong></div>`).join(''):empty('No sales')}</section>
 ${salesChart()}`;
}
let chartRange='week';
function setChartRange(r){chartRange=r;render()}
function salesChart(){
 const now=new Date(),Y=now.getFullYear(),M=now.getMonth(),D=now.getDate(),year=chartRange==='year',n=chartRange==='week'?7:30,bk=[];
 if(year)for(let i=11;i>=0;i--){const a=new Date(Y,M-i,1),b=new Date(Y,M-i+1,1);bk.push({a:+a,b:+b,label:a.toLocaleDateString('en-GB',{month:'short'}),sum:0,n:0})}
 else for(let i=n-1;i>=0;i--){const a=new Date(Y,M,D-i),b=new Date(Y,M,D-i+1);bk.push({a:+a,b:+b,label:n===7?a.toLocaleDateString('en-GB',{weekday:'short'}):String(a.getDate()),sum:0,n:0})}
 sales.forEach(s=>{const x=bk.find(k=>s.date>=k.a&&s.date<k.b);if(x){x.sum+=+s.total||0;(x.o=x.o||new Set()).add(s.orderId||s.id)}});
 const total=bk.reduce((a,k)=>a+k.sum,0),count=bk.reduce((a,k)=>a+(k.o?k.o.size:0),0),max=Math.max(1,...bk.map(k=>k.sum)),H=130,gap=year?6:(n===7?9:3),showVal=year||n===7;
 const tabs=[['week','Week'],['month','Month'],['year','Year']].map(([k,l])=>`<button onclick="setChartRange('${k}')" style="border:0;border-radius:8px;padding:6px 11px;font-size:12px;background:${chartRange===k?'#292e30':'transparent'};color:${chartRange===k?'#fff':'var(--muted)'}">${l}</button>`).join('');
 const bars=bk.map((k,i)=>{const h=k.sum>0?Math.max(4,k.sum/max*H):2,last=i===bk.length-1;return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">${showVal&&k.sum>0?`<div style="font-size:10px;color:var(--muted);margin-bottom:3px;white-space:nowrap">${Math.round(k.sum)}</div>`:''}<div style="width:100%;height:${h}px;border-radius:6px 6px 2px 2px;background:${k.sum>0?(last?'linear-gradient(180deg,#b9e6c9,#5f8f72)':'linear-gradient(180deg,#8fb59d,#46604f)'):'var(--line)'}"></div></div>`}).join('');
 const labels=bk.map((k,i)=>`<div style="flex:1;min-width:0;display:flex;justify-content:center;font-size:10px;color:var(--muted);white-space:nowrap">${(!year&&n===30&&(bk.length-1-i)%5!==0)?'':k.label}</div>`).join('');
 return `<section class="panel" style="margin-top:13px"><div class="panel-head"><h2>Sales</h2><div style="display:flex;gap:3px;background:#111314;border:1px solid var(--line);border-radius:11px;padding:3px">${tabs}</div></div><div style="margin:0 0 16px"><span style="font-size:24px;font-weight:720;letter-spacing:-1px">${money(total)}</span> <span class="tiny">${count} sale${count===1?'':'s'} · ${year?'last 12 months':'last '+n+' days'}</span></div><div style="display:flex;align-items:flex-end;gap:${gap}px;height:${H+20}px;padding-top:4px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50%">${bars}</div><div style="display:flex;gap:${gap}px;margin-top:6px">${labels}</div></section>`;
}
function inventory(){
 return `<div class="pagehead" style="gap:10px;align-items:stretch"><button class="btn primary" onclick="openProduct()" style="flex:1;padding:17px 20px;font-size:18px;border-radius:14px">＋ Add product</button><button class="btn" onclick="openStockList()" style="padding:17px 20px;font-size:16px;border-radius:14px">Stock list</button></div>
 <div class="toolbar"><input id="searchProducts" style="max-width:280px" oninput="filterProducts()"><select id="categoryFilter" style="max-width:190px" onchange="filterProducts()"><option value="">All models</option>${[...new Set(products.map(p=>p.category).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
 <section class="panel"><div id="productRows">${productRows(products)}</div></section>`;
}
function productRows(list){if(!list.length)return empty('Out of stock');return `<div class="tablewrap"><table class="table"><thead><tr><th>Flavour</th><th>Model</th><th>Quantity</th><th></th></tr></thead><tbody>${[...list].sort((a,b)=>stock(b)-stock(a)||a.name.localeCompare(b.name)).map(p=>`<tr><td><div class="pname">${esc(p.name)}</div></td><td>${esc(p.category||'—')}</td><td><span class="pill ${stock(p)<=settings.lowStock?'low':'good'}">${stock(p)}</span></td><td class="right"><span style="display:inline-flex;gap:6px"><button class="btn small" onclick="openProduct('${p.id}')">Edit</button><button class="btn small danger" onclick="deleteProduct('${p.id}')">Delete</button></span></td></tr>`).join('')}</tbody></table></div>`}
function filterProducts(){const q=document.getElementById('searchProducts').value.toLowerCase(),c=document.getElementById('categoryFilter').value;document.getElementById('productRows').innerHTML=productRows(products.filter(p=>(p.name+' '+(p.category||'')).toLowerCase().includes(q)&&(!c||p.category===c)))}
function salesPage(){return `<div class="pagehead"><div><h1>Sales</h1></div><button class="btn primary" onclick="openSale()" style="padding:13px 20px;font-size:16px">＋ New sale</button></div><div class="grid" style="margin-bottom:14px">${stat('Total sales',new Set(sales.map(s=>s.orderId||s.id)).size)}${stat('Revenue',money(totalRevenue()))}${stat('Items sold',unitsSold())}${stat('Profit',money(totalRevenue()-overviewCost()))}</div><section class="panel">${sales.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Flavour</th><th>Model</th><th>Qty</th><th>Sale total</th><th></th></tr></thead><tbody>${[...sales].sort((a,b)=>b.date-a.date).map(s=>{const p=products.find(p=>p.id===s.productId);return `<tr><td>${dateLabel(s.date)}</td><td>${esc(productName(s.productId))}</td><td>${esc(p?.category||'—')}</td><td>${s.qty}</td><td>${money(s.total)}</td><td class="right"><button class="btn small danger" onclick="deleteSale('${s.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:empty('No sales')}</section>`}
function analytics(){
 const month=new Date();const monthSales=sales.filter(s=>{const d=new Date(s.date);return d.getMonth()===month.getMonth()&&d.getFullYear()===month.getFullYear()});
 const byProduct={};sales.forEach(s=>byProduct[s.productId]=(byProduct[s.productId]||0)+s.qty);
 const best=Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,5),max=Math.max(1,...best.map(x=>x[1]));
 const cats={};products.forEach(p=>cats[p.category||'Other']=(cats[p.category||'Other']||0)+stock(p));
 return `<div class="pagehead"><div><h1>Analytics</h1></div></div><div class="grid">${stat('This month',money(monthSales.reduce((a,s)=>a+s.total,0)))}${stat('Profit',money(totalRevenue()-overviewCost()))}${stat('Units sold',unitsSold())}${stat('Products in stock',products.reduce((n,p)=>n+stock(p),0))}</div><div class="two"><section class="panel"><h2>Best sellers</h2>${best.length?`<div class="barlist">${best.map(([id,n])=>`<div class="baritem"><span>${esc(productName(id))}</span><div class="bartrack"><div class="barfill" style="width:${n/max*100}%"></div></div><strong class="right">${n}</strong></div>`).join('')}</div>`:empty('No sales')}</section><section class="panel"><h2>Stock by model</h2>${Object.keys(cats).length?Object.entries(cats).map(([c,n])=>`<div class="row"><span>${esc(c)}</span><strong>${n} units</strong></div>`).join(''):empty('Out of stock')}</section></div>`;
}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn small" onclick="closeModal()">✕</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openProduct(id){const p=products.find(p=>p.id===id)||{name:'',category:'RAVE 40K',variants:[{id:uid(),size:'',color:'',qty:1,cost:0,price:20}]};const oldVariants=variants(p);const quantity=oldVariants.reduce((n,v)=>n+(Number(v.qty)||0),0);const first=oldVariants[0]||{id:uid(),qty:1,cost:0,price:20};const models=['RAVE 40K','STAR 40K','VISTA 40K'];if(p.category&&!models.includes(p.category))models.push(p.category);const qtyOptions=Array.from({length:10},(_,i)=>i+1);if(!qtyOptions.includes(quantity))qtyOptions.push(quantity);qtyOptions.sort((a,b)=>a-b);modal(id?'Edit product':'Add product',`<form id="productForm"><div class="formrow"><div class="field"><label>Flavour *</label><input name="name" required autocomplete="off" list="flavourList" value="${esc(p.name)}"><datalist id="flavourList">${[...new Set(products.map(x=>(x.name||'').trim()).filter(Boolean))].sort().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div><div class="field"><label>Model</label><select name="category">${models.map(m=>`<option value="${m}" ${p.category===m?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="formrow"><div class="field"><label>Quantity</label><select name="quantity">${qtyOptions.map(n=>`<option value="${n}" ${quantity===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save product</button></div></form>`);
 document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();const f=e.target,old=products.find(x=>x.id===id);
  if(!id){const nm=f.name.value.trim().toLowerCase(),same=products.find(x=>x.name.trim().toLowerCase()===nm&&x.category===f.category.value);
   if(same){const add=Number(f.quantity.value);if(!confirm(`You already have ${same.name} (${same.category}) with ${stock(same)} in stock.\n\nAdd ${add} more to it?`))return;
    if(!variants(same).length)same.variants=[{id:uid(),size:'',color:'',qty:0,cost:0,price:20}];
    same.variants[0].qty=(Number(same.variants[0].qty)||0)+add;await put('products',same);closeModal();await refresh();return}}
  await put('products',{id:id||uid(),name:f.name.value.trim(),category:f.category.value,variants:[{id:first.id||uid(),size:'',color:'',qty:Number(f.quantity.value),cost:0,price:Number(first.price)||20}],createdAt:old?.createdAt||Date.now()});closeModal();await refresh()};
}
function openStockList(){
 const order=['RAVE 40K','STAR 40K','VISTA 40K'],groups={};
 products.filter(p=>stock(p)>0).forEach(p=>{const c=p.category||'Other';(groups[c]=groups[c]||new Set()).add((p.name||'').trim())});
 const models=Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
 const cols=models.map(m=>`<div style="min-width:0"><div style="color:var(--muted);font-size:.8em;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:.4em;margin-bottom:.4em">${esc(m)}</div>${[...groups[m]].sort((a,b)=>a.localeCompare(b)).map(n=>`<div style="padding:.18em 0;line-height:1.25;overflow-wrap:anywhere">${esc(n)}</div>`).join('')}</div>`).join('');
 document.getElementById('modalRoot').innerHTML=`<div style="position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><strong style="font-size:18px;letter-spacing:-.5px">dūmu aparāti</strong> <span class="muted" style="margin-left:6px">in stock</span></div><button class="btn small" onclick="closeModal()">✕</button></div><div id="slBody" style="flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(${Math.max(1,models.length)},minmax(0,1fr));gap:12px;align-content:start">${models.length?cols:empty('Out of stock')}</div></div>`;
 const b=document.getElementById('slBody');let size=18;b.style.fontSize=size+'px';
 while(size>8&&b.scrollHeight>b.clientHeight+1){size--;b.style.fontSize=size+'px'}
}
function resizeImage(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}
function openSale(){
 const items=()=>products.flatMap(p=>variants(p).filter(v=>v.qty>0).map(v=>({p,v})));
 if(!items().length){alert('Add a product before recording a sale.');return}
 const cart={};
 modal('New sale',`<form id="saleForm"><div class="formrow"><div class="field"><label>Flavour</label><select id="cartItem"></select></div><div class="field" style="flex:none"><label>&nbsp;</label><button type="button" class="btn primary" id="cartAdd">Add</button></div></div><div id="cartList"></div><div class="formrow" style="align-items:flex-end;margin-top:14px"><div class="field"><label>&nbsp;</label><select id="salePrice">${[0,15,20,25].map(n=>`<option value="${n}" ${n===20?'selected':''}>${n} €</option>`).join('')}</select></div><div style="flex:1;text-align:right;margin-bottom:14px"><div class="tiny">Total</div><div id="cartTotal" style="font-size:26px;font-weight:720;letter-spacing:-1px">${money(0)}</div></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saleSave">Save</button></div></form>`);
 const sel=document.getElementById('cartItem'),list=document.getElementById('cartList'),price=document.getElementById('salePrice'),add=document.getElementById('cartAdd'),save=document.getElementById('saleSave'),total=document.getElementById('cartTotal');
 function draw(){
  const lines=Object.values(cart),keep=sel.value,open=items().filter(x=>(cart[x.v.id]?cart[x.v.id].n:0)<x.v.qty);
  sel.innerHTML=open.map(x=>`<option value="${x.v.id}">${esc(x.p.name)} · ${esc(x.p.category||'')}${variants(x.p).length>1?' · '+esc([x.v.size,x.v.color].filter(Boolean).join(' / ')||'Default'):''}</option>`).join('');
  if(open.some(x=>x.v.id===keep))sel.value=keep;
  add.disabled=!open.length;add.style.opacity=open.length?1:.45;
  list.innerHTML=lines.map(c=>`<div class="row"><div><div class="pname">${esc(c.p.name)}</div><div class="tiny">${esc(c.p.category||'')}</div></div><div style="display:flex;align-items:center;gap:12px"><button type="button" class="btn small" data-k="${c.v.id}" data-d="-1">−</button><strong style="min-width:18px;text-align:center">${c.n}</strong><button type="button" class="btn small" data-k="${c.v.id}" data-d="1" ${c.n>=c.v.qty?'disabled style="opacity:.4"':''}>+</button></div></div>`).join('');
  total.textContent=money(lines.reduce((n,c)=>n+c.n,0)*Number(price.value));
  save.disabled=!lines.length;save.style.opacity=lines.length?1:.45;
 }
 add.onclick=()=>{const x=items().find(i=>i.v.id===sel.value);if(!x)return;const c=cart[x.v.id]||(cart[x.v.id]={p:x.p,v:x.v,n:0});if(c.n<x.v.qty)c.n++;draw()};
 list.onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;const c=cart[b.dataset.k];if(!c)return;c.n+=Number(b.dataset.d);if(c.n>c.v.qty)c.n=c.v.qty;if(c.n<=0)delete cart[b.dataset.k];draw()};
 price.onchange=draw;draw();
 document.getElementById('saleForm').onsubmit=async e=>{e.preventDefault();const lines=Object.values(cart);if(!lines.length)return;const pr=Number(price.value),oid=uid(),now=Date.now();
  for(const l of lines){const p=products.find(x=>x.id===l.p.id),v=p&&variants(p).find(x=>x.id===l.v.id);if(!v||l.n<1||l.n>v.qty){alert('Not enough stock for '+l.p.name+'.');return}}
  for(const l of lines){const p=products.find(x=>x.id===l.p.id),v=variants(p).find(x=>x.id===l.v.id);v.qty-=l.n;await put('products',p);await put('sales',{id:uid(),orderId:oid,productId:p.id,variantId:v.id,qty:l.n,unitPrice:pr,total:l.n*pr,date:now,costAtSale:Number(settings.unitCost)||0})}
  closeModal();await refresh()};
}
async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const n=sales.filter(x=>x.productId===id).length;if(!confirm(`Delete "${p.name}" (${p.category||'—'}) from inventory?`+(n?`\n\nIts ${n} past sale(s) stay in Sales and Analytics, shown as "Deleted product".`:'')))return;await del('products',id);await refresh()}
async function clearHistory(){if(!confirm('tiešām?'))return;if(!confirm('chista ble?'))return;if(!confirm('nu bisk uzgaidi vari pardomat sito'))return;const t=db.transaction('sales','readwrite');t.objectStore('sales').clear();await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});closeModal();await refresh()}
async function deleteSale(id){if(!confirm('Delete this sale and return its items to stock?'))return;const s=sales.find(x=>x.id===id),p=products.find(x=>x.id===s.productId),v=p&&variants(p).find(x=>x.id===s.variantId);if(v){v.qty+=s.qty;await put('products',p)}await del('sales',id);await refresh()}
function backup(){const data={app:'dumu-aparati',version:1,exportedAt:new Date().toISOString(),products,sales,expenses,settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dumu-aparati-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('settingsBtn').onclick=()=>{modal('Settings',`<div class="field"><label>My cost per item (€)</label><input id="unitCostInput" type="number" inputmode="decimal" min="0" step="0.01" value="${Number(settings.unitCost)||0}"></div><div class="field"><label>Low stock warning</label><input id="lowStockInput" type="number" min="0" value="${settings.lowStock}"></div><div class="actions" style="justify-content:flex-start;margin-top:4px"><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div style="border-top:1px solid var(--line);margin:20px 0 14px"></div><div class="eyebrow" style="margin-bottom:10px">Data</div><div class="actions" style="justify-content:flex-start;flex-wrap:wrap;margin-top:0"><button class="btn" onclick="backup()">Backup</button><button class="btn" onclick="document.getElementById('importFile').click();closeModal()">Import backup</button><button class="btn danger" onclick="clearHistory()">Remove history</button></div>`)}
async function saveSettings(){settings.lowStock=Math.max(0,Number(document.getElementById('lowStockInput').value)||0);settings.unitCost=Math.max(0,Number(document.getElementById('unitCostInput').value)||0);await put('settings',{id:'main',...settings});closeModal();render()}
document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='dumu-aparati'||!Array.isArray(d.products)||!Array.isArray(d.sales)||!Array.isArray(d.expenses))throw Error('Invalid backup');if(!confirm('Importing will replace the current products and sales. Continue?'))return;for(const s of ['products','sales','expenses']){const t=db.transaction(s,'readwrite'),store=t.objectStore(s);store.clear();d[s].forEach(x=>store.put(x));await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)})}settings=d.settings||settings;await put('settings',{id:'main',...settings});await refresh();alert('Backup imported.')}catch(err){alert('Could not import this backup file.')}e.target.value=''};
(async()=>{try{db=await openDB();const st=await all('settings');if(st[0])settings={lowStock:st[0].lowStock??2,unitCost:st[0].unitCost??0};await refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http')){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('./sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window._r){window._r=1;location.reload()}})}}catch(e){document.getElementById('app').innerHTML=empty('Could not start the app','Please open this app in a modern browser with storage enabled.')}})();
</script>
</body>
